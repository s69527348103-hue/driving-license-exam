<title>ติวใบขับขี่ ข้อสอบกฎหมายรถยนต์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f1ea; --surface:#ffffff; --ink:#1c2321; --muted:#5d6763; --line:#dcd8cc;
  --road:#2b3230; --sign:#0f6b4a; --sign-ink:#ffffff; --accent:#f2b705; --accent-ink:#231b00;
  --ok:#1f8f4e; --ok-bg:#e2f5ea; --bad:#c8392b; --bad-bg:#fbe5e1;
  --amber:#f2b705; --blue:#2f6fd0; --red:#c8392b; --teal:#0f8b8d; --green:#1f8f4e; --purple:#7a4fc4; --orange:#e07a1f; --pink:#d2437c;
  --radius:14px; --shadow:0 2px 0 rgba(0,0,0,.06),0 8px 24px rgba(20,30,25,.08);
  --font:'Prompt','Noto Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif;
  --body:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141917; --surface:#1e2522; --ink:#eef1ee; --muted:#9aa6a1; --line:#33403a;
    --road:#0d100f; --sign:#1a8a62; --ok:#4cd08a; --ok-bg:#153524; --bad:#ff7b6b; --bad-bg:#3d1c18;
    --shadow:0 2px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1e2522; --ink:#eef1ee; --muted:#9aa6a1; --line:#33403a;
  --road:#0d100f; --sign:#1a8a62; --ok:#4cd08a; --ok-bg:#153524; --bad:#ff7b6b; --bad-bg:#3d1c18;
  --shadow:0 2px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
h1,h2,h3,.tt{font-family:var(--font);text-wrap:balance;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 60px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--road);color:#fff;border-bottom:4px solid var(--accent)}
.top .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--font);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .sign{background:var(--sign);border:2px solid #fff;border-radius:8px;padding:0 8px;font-size:.9rem}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:#dfe6e2;padding:6px 12px;border-radius:999px;font-family:var(--font);font-size:.95rem}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-family:var(--font);font-size:.9rem}
.iconbtn[aria-pressed="false"]{opacity:.6}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.btn{font-family:var(--font);border:2px solid var(--road);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 18px;font-weight:600;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.btn.small{padding:5px 12px;font-size:.9rem;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.chip{display:inline-block;font-family:var(--font);font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.notice{border-left:5px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:8px;font-size:.95rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
[hidden]{display:none!important}

/* hero road */
.hero{margin-top:18px;background:var(--road);color:#fff;border-radius:var(--radius);padding:22px 20px 0;overflow:hidden;position:relative}
.hero h1{font-size:clamp(1.5rem,5vw,2.3rem)}
.hero p{margin:.4rem 0 1rem;color:#cfd8d3;max-width:34em}
.road{height:64px;position:relative;margin-inline:-20px;background:linear-gradient(#3a423f,#2b3230)}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:repeating-linear-gradient(90deg,#f2b705 0 28px,transparent 28px 56px);animation:dash 1s linear infinite}
.car{position:absolute;bottom:14px;font-size:2.4rem;animation:drive 7s linear infinite;filter:drop-shadow(0 4px 2px rgba(0,0,0,.4))}
@keyframes dash{to{background-position:-56px 0}}
@keyframes drive{0%{left:-60px}100%{left:100%}}

/* stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-block:16px}
.stat b{font-family:var(--font);font-size:1.9rem;display:block;font-variant-numeric:tabular-nums}

/* study cards */
.tcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;border-top:6px solid var(--hue,var(--accent));transition:transform .15s}
.tcard:hover{transform:translateY(-3px) rotate(-.4deg)}
.tcard .ic{font-size:2rem}
.tcard .rh{font-size:.92rem;color:var(--muted)}

/* scene player */
.scene{--hue:var(--accent)}
.stage{display:grid;gap:16px;grid-template-columns:200px 1fr;align-items:start}
@media(max-width:640px){.stage{grid-template-columns:1fr}}
.badge{aspect-ratio:1;max-width:220px;width:100%;position:relative;display:grid;place-items:center;margin-inline:auto}
.badge svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.badge .track{fill:none;stroke:var(--line);stroke-width:12}
.badge .arc{fill:none;stroke:var(--hue);stroke-width:12;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.badge .num{font-family:var(--font);font-weight:800;font-size:3.6rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.badge .num small{display:block;font-size:1rem;font-weight:500;color:var(--muted)}
.badge .emo{font-size:4.6rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.06)}}
.rhyme{font-family:var(--font);font-weight:700;font-size:1.15rem;background:var(--hue);color:#fff;padding:10px 14px;border-radius:12px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.beats{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.beat{display:flex;gap:12px;align-items:center;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;width:100%;opacity:.55;transform:translateX(-10px);transition:all .35s}
.beat .e{font-size:1.6rem;width:2.2rem;text-align:center}
.beat.show{opacity:1;transform:none}
.beat.now{border-color:var(--hue);box-shadow:0 0 0 4px color-mix(in srgb,var(--hue) 25%,transparent);animation:pop .5s}
@keyframes pop{40%{transform:scale(1.03)}}
.trip{height:34px;background:var(--road);border-radius:10px;position:relative;margin-top:14px;overflow:hidden}
.trip::before{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:3px dashed #f2b705}
.trip .c{position:absolute;top:1px;left:0;font-size:1.6rem;transition:left 1s ease-in-out}

/* quiz */
.qbar{height:12px;background:var(--line);border-radius:99px;position:relative;margin:14px 0 4px}
.qbar i{display:block;height:100%;background:var(--sign);border-radius:99px;transition:width .5s}
.qbar span{position:absolute;top:-14px;font-size:1.3rem;transition:left .5s;transform:translateX(-50%)}
.qtext{font-family:var(--font);font-size:1.2rem;font-weight:500;margin:10px 0 14px}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;transition:transform .12s,border-color .12s}
.ch:hover:not(:disabled){border-color:var(--sign);transform:translateX(3px)}
.ch .k{font-family:var(--font);font-weight:700;background:var(--road);color:#fff;border-radius:8px;min-width:2rem;text-align:center;padding:0 6px}
.ch.right{border-color:var(--ok);background:var(--ok-bg);animation:pulse .6s}
.ch.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .45s}
.ch:disabled{cursor:default}
@keyframes pulse{50%{transform:scale(1.025)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;animation:rise .4s}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b{font-family:var(--font)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.warn{margin-top:8px;font-size:.9rem;color:var(--muted)}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* result */
.ring{width:190px;height:190px;position:relative;margin-inline:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font);font-weight:800;font-size:2.6rem;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 3.4rem;gap:10px;align-items:center;font-size:.92rem}
.bar .b{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--sign);width:0;transition:width 1s}

/* key list */
.kitem{padding:14px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.kitem .ans{color:var(--ok);font-weight:700}
.kitem li.right{color:var(--ok);font-weight:600}
.kitem ol{margin:6px 0;padding-left:0;list-style:none}
select,input[type=range]{font:inherit}
select{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
table.cheat{border-collapse:collapse;width:100%}
table.cheat td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.cheat td:first-child{font-family:var(--font);font-weight:700;white-space:nowrap;color:var(--sign)}
.tblwrap{overflow-x:auto}
.panel{margin-top:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:2px solid var(--line);border-radius:10px;padding:4px 12px;cursor:pointer;background:var(--surface)}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){border-color:var(--sign);background:var(--ok-bg)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .car{left:40%}
}
@media print{
  .top,.no-print,.btn,.iconbtn{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none}
}

</style>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LET = ['ก', 'ข', 'ค', 'ง'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const topicOf = id => TOPICS.find(t => t.id === id);
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- storage (try/catch: อาจใช้ไม่ได้ในบางสภาพแวดล้อม) ---------- */
const Store = {
  mem: {},
  get(k, d) { try { const v = localStorage.getItem('dl-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return k in this.mem ? this.mem[k] : d; } },
  set(k, v) { try { localStorage.setItem('dl-' + k, JSON.stringify(v)); } catch (e) { this.mem[k] = v; } }
};

/* ---------- เสียงพากย์ไทย (Web Speech API) ---------- */
const Voice = {
  ok: 'speechSynthesis' in window,
  on: Store.get('voice', true),
  auto: Store.get('auto', true),
  rate: Store.get('rate', 0.95),
  voiceName: Store.get('vname', ''),
  list: [], token: 0,
  load() {
    if (!this.ok) return;
    this.list = speechSynthesis.getVoices().filter(v => /^th/i.test(v.lang));
  },
  pick() {
    return this.list.find(v => v.name === this.voiceName) ||
      this.list.find(v => /natural|online|premwadee|niwat|achara/i.test(v.name)) || this.list[0] || null;
  },
  cur: null,
  hasClips: () => !!(window.CLIPS && window.CLIPS.size),
  // เล่นไฟล์เสียงธรรมชาติที่บันทึกไว้ล่วงหน้า (คืน true เมื่อเล่นจนจบ)
  clip(h, my) {
    return new Promise(res => {
      const a = new Audio('audio/' + h + '.mp3');
      this.cur = a;
      a.playbackRate = Math.min(1.6, Math.max(0.6, this.rate / 0.95));
      const end = ok => { if (this.cur === a) this.cur = null; res(ok); };
      a.onended = () => end(true); a.onerror = () => end(false);
      a.play().catch(() => end(false));
    });
  },
  // เสียงสำรองของเบราว์เซอร์ (เมื่อไม่มีไฟล์เสียง)
  tts(t, my) {
    return new Promise(res => {
      if (!this.ok) return res(false);
      const wait = Math.max(1400, t.length * 85);
      const parts = t.match(/[^.!?。]+[.!?。]?/g) || [t];
      let i = 0, done = false;
      const finish = () => { if (!done) { done = true; res(true); } };
      const next = () => {
        if (my !== this.token || i >= parts.length) return finish();
        const u = new SpeechSynthesisUtterance(parts[i++]);
        u.lang = 'th-TH'; u.rate = this.rate;
        const v = this.pick(); if (v) u.voice = v;
        u.onend = next; u.onerror = finish;
        speechSynthesis.speak(u);
      };
      next();
      setTimeout(finish, wait * 2.2 + 3000);
    });
  },
  // อ่านข้อความ (หรือหลายท่อนต่อกัน) คืน Promise<boolean> — true = อ่านจบโดยไม่ถูกสั่งหยุด
  async say(texts, opt = {}) {
    const segs = [].concat(texts), my = ++this.token;
    this.halt();
    for (const raw of segs) {
      if (my !== this.token) return false;
      const t = SP.clean(raw), h = SP.hash(raw);
      if (!this.on) { await new Promise(r => setTimeout(r, opt.silent ? Math.max(1400, t.length * 85) : 200)); continue; }
      let ok = false;
      if (window.CLIPS && CLIPS.has(h)) ok = await this.clip(h, my);
      if (!ok && my === this.token) ok = await this.tts(t, my);
      if (!ok && my === this.token) await new Promise(r => setTimeout(r, Math.max(1400, t.length * 85)));
    }
    return my === this.token;
  },
  halt() { if (this.cur) { const a = this.cur; this.cur = null; a.onended = a.onerror = null; a.pause(); } if (this.ok) speechSynthesis.cancel(); },
  stop() { this.token++; this.halt(); },
  save() { Store.set('voice', this.on); Store.set('auto', this.auto); Store.set('rate', this.rate); Store.set('vname', this.voiceName); }
};
if (Voice.ok) { Voice.load(); speechSynthesis.onvoiceschanged = () => { Voice.load(); if (window.renderVoiceInfo) renderVoiceInfo(); }; }

/* ---------- confetti ---------- */
function confetti() {
  if (reduced) return;
  const c = document.createElement('canvas'); c.className = 'confetti';
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const g = c.getContext('2d'), cols = ['#f2b705', '#1f8f4e', '#2f6fd0', '#d2437c', '#e07a1f'];
  const ps = Array.from({ length: 90 }, () => ({ x: c.width / 2, y: c.height * .55, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: cols[Math.random() * 5 | 0] }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.r += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else c.remove();
  })();
}

/* ---------- ตัวนับเลข ---------- */
function countUp(el, to, ms = 1200) {
  if (reduced) { el.textContent = to; return; }
  const t0 = performance.now();
  (function s(t) { const p = Math.min(1, (t - t0) / ms); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(s); })(t0);
}

/* ---------- ความคืบหน้า ---------- */
const Prog = {
  wrong: () => new Set(Store.get('wrong', [])),
  addWrong(id) { const s = this.wrong(); s.add(id); Store.set('wrong', [...s]); },
  clearWrong(id) { const s = this.wrong(); s.delete(id); Store.set('wrong', [...s]); },
  best: () => Store.get('best', 0),
  done: () => Store.get('rounds', 0)
};

</script>
<script>
'use strict';
const view = () => $('#view');
let playTok = 0;

function go(name, arg) {
  Voice.stop(); playTok++;
  $$('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.go === name || (name === 'scene' && b.dataset.go === 'study') || (name === 'quiz' && b.dataset.go === 'setup') ? 'page' : 'false'));
  ({ home: Home, study: Study, scene: Scene, setup: Setup, quiz: Quiz, result: Result, key: Key })[name](arg);
  scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
}

/* ---------- หน้าหลัก ---------- */
function Home() {
  const wrong = Prog.wrong().size, best = Prog.best();
  view().innerHTML = `
  <section class="hero">
    <h1>ติวข้อสอบใบขับขี่ หมวดกฎหมายรถยนต์</h1>
    <p>${QS.length} ข้อ พร้อมเฉลยและเหตุผล · ตัวช่วยจำแบบมีอนิเมชัน · ฟังเสียงพากย์ภาษาไทยได้</p>
    <div class="row" style="margin-bottom:18px">
      <button class="btn primary" data-go="study">🧠 เรียนตัวช่วยจำก่อน</button>
      <button class="btn go" data-go="setup">📝 เริ่มทำข้อสอบ</button>
    </div>
    <div class="road" aria-hidden="true"><span class="car">🚗</span></div>
  </section>
  <div class="stats">
    <div class="card stat"><b>${QS.length}</b>ข้อสอบทั้งหมด</div>
    <div class="card stat"><b>${Prog.done()}</b>รอบที่ทำแล้ว</div>
    <div class="card stat"><b>${best}%</b>คะแนนสูงสุด</div>

    <div class="tblwrap"><table class="cheat">${CHEAT.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>
  </div>
  <p class="notice" style="margin-top:14px">ข้อสอบนี้จัดทำจากไฟล์ต้นฉบับ (บทความปี 2018) ซึ่งประกาศว่ามี 78 ข้อ แต่เลขข้อ 67–68 ซ้ำกัน จึงเรียงใหม่ได้ <b>80 ข้อ</b> ข้อที่ต้นฉบับกำกวมมีหมายเหตุกำกับ ก่อนสอบจริงควรตรวจเกณฑ์ล่าสุดกับกรมการขนส่งทางบกอีกครั้ง</p>`;
}

/* ---------- ตัวช่วยจำ: รายการหมวด ---------- */
function Study() {
  view().innerHTML = `<h2 class="tt" style="margin:20px 0 4px">ตัวช่วยจำ 8 หมวด</h2>
  <p class="muted" style="margin-top:0">เลือกหมวด แล้วกด ▶ เพื่อดูอนิเมชันพร้อมเสียงพากย์ไทย</p>

    return `<button class="tcard" style="--hue:var(--${t.hue})" data-go="scene" data-arg="${t.id}">
      <span class="ic">${t.icon}</span><b class="tt">${esc(t.title)}</b>

  }).join('')}</div>`;

/* ---------- ตัวเล่นอนิเมชัน + พากย์เสียง ---------- */
function Scene(id) {
  const t = topicOf(id), n = QS.filter(q => q[1] === id).length;
  const hero = t.hero.num != null
    ? `<div class="num"><span id="hn">${t.hero.num}</span><small>${t.hero.unit}</small></div>`
    : `<div class="emo">${t.hero.emoji}</div>`;
  view().innerHTML = `<div class="scene" style="--hue:var(--${t.hue});margin-top:18px">
    <button class="btn small" data-go="study">← กลับ</button>
    <h2 class="tt" style="margin:12px 0">${t.icon} ${esc(t.title)}</h2>
    <div class="stage">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="arc" id="arc" cx="60" cy="60" r="52"/></svg>${hero}
      </div>
      <div>
        <div class="rhyme">${esc(t.rhyme)}</div>
        <div class="row" style="margin-top:12px">
          <button class="btn go" id="play">▶ ฟังพร้อมอนิเมชัน</button>
          <button class="btn" id="stop">⏹ หยุด</button>
          <button class="btn" data-go="setup" data-arg="${id}">📝 ฝึกหมวดนี้ (${n} ข้อ)</button>
        </div>
        <ul class="beats" id="beats">${t.beats.map((b, i) => `<li><button class="beat show" data-i="${i}"><span class="e">${b.e}</span><span>${esc(b.t)}</span></button></li>`).join('')}</ul>
        <div class="trip" aria-hidden="true"><span class="c" id="tc">🚗</span></div>
      </div>
    </div></div>`;
  $('#arc').style.strokeDashoffset = 0;
  const bs = $$('.beat'), arc = $('#arc'), car = $('#tc');
  const setProg = (i, total) => {
    arc.style.strokeDashoffset = 326.7 * (1 - (i + 1) / total);
    const trip = car.parentElement.clientWidth - 34;
    car.style.left = trip * (i + 1) / total + 'px';
  };
  const mark = i => { bs.forEach((b, k) => { b.classList.toggle('now', k === i); }); bs[i].classList.add('show'); setProg(i, bs.length); };
  async function play() {
    const tok = ++playTok; Voice.stop(); playTok = tok;
    bs.forEach(b => b.classList.remove('show', 'now'));
    arc.style.transition = 'none'; arc.style.strokeDashoffset = 326.7; void arc.getBoundingClientRect(); arc.style.transition = '';
    car.style.left = '0px';
    if (t.hero.num != null) countUp($('#hn'), t.hero.num, 1100);
    if (!await Voice.say(t.intro, { silent: true }) || tok !== playTok) return;
    for (let i = 0; i < bs.length; i++) {
      mark(i);
      if (!await Voice.say(t.beats[i].say, { silent: true }) || tok !== playTok) return;
    }
    bs.forEach(b => b.classList.remove('now'));
    confetti();
    await Voice.say([SP.outro, t.rhyme], { silent: true });
  }
  $('#play').onclick = play;
  $('#stop').onclick = () => { playTok++; Voice.stop(); bs.forEach(b => b.classList.remove('now')); };
  bs.forEach((b, i) => b.onclick = () => { playTok++; mark(i); Voice.say(t.beats[i].say, { silent: true }); });
}

</script>
<script>
'use strict';
let QZ = null;

/* ---------- ตั้งค่าก่อนสอบ ---------- */
function Setup(pre) {
  const wrongN = Prog.wrong().size;
  const opts = [['all', 'ทุกหมวด'], ...TOPICS.map(t => [t.id, t.icon + ' ' + t.title])];
  if (wrongN) opts.push(['wrong', '❗ ข้อที่เคยผิด (' + wrongN + ')']);
  view().innerHTML = `<h2 class="tt" style="margin:20px 0 10px">ตั้งค่าข้อสอบ</h2>
  <div class="card panel">
    <b class="tt">หมวด</b>
    <div class="seg" style="margin:8px 0 14px">${opts.map(o => `<label><input type="radio" name="tp" value="${o[0]}" ${o[0] === (pre || 'all') ? 'checked' : ''}><span>${esc(o[1])}</span></label>`).join('')}</div>
    <b class="tt">จำนวนข้อ</b>
    <div class="seg" style="margin:8px 0 14px">${[10, 20, 40, 80].map(n => `<label><input type="radio" name="cnt" value="${n}" ${n === 20 ? 'checked' : ''}><span>${n === 80 ? 'ทั้งหมด' : n + ' ข้อ'}</span></label>`).join('')}</div>
    <b class="tt">โหมด</b>
    <div class="seg" style="margin:8px 0 14px">
      <label><input type="radio" name="md" value="practice" checked><span>ฝึก (เฉลยทันที)</span></label>
      <label><input type="radio" name="md" value="exam"><span>สอบจริง (เฉลยตอนจบ)</span></label></div>
    <label class="row" style="margin-bottom:16px"><input type="checkbox" id="shuf" checked> สลับลำดับข้อ</label>
    <button class="btn go" id="start">▶ เริ่มทำข้อสอบ</button>
  </div>`;
  $('#start').onclick = () => {
    const tp = $('input[name=tp]:checked').value, cnt = +$('input[name=cnt]:checked').value, md = $('input[name=md]:checked').value;
    let list = QS.filter(q => tp === 'all' || (tp === 'wrong' ? Prog.wrong().has(q[0]) : q[1] === tp));
    if ($('#shuf').checked) list = list.map(q => [Math.random(), q]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    list = list.slice(0, cnt);
    if (!list.length) return;
    QZ = { list, i: 0, mode: md, ans: [], topic: tp };
    go('quiz');
  };
}

/* ---------- ทำข้อสอบ ---------- */
function Quiz() {
  if (!QZ) return go('setup');
  const q = QZ.list[QZ.i], N = QZ.list.length, t = topicOf(q[1]), pct = QZ.i / N * 100;
  view().innerHTML = `<div style="margin-top:16px" class="row"><span class="chip">ข้อ ${QZ.i + 1} / ${N}</span><span class="chip">${t.icon} ${esc(t.title)}</span><span class="chip">เลขข้อในสมุดเฉลย ${q[0]}</span>
    <span style="margin-left:auto"><button class="btn small" id="say">🔊 ฟังโจทย์</button></span></div>
  <div class="qbar" aria-hidden="true"><i style="width:${pct}%"></i><span style="left:${Math.max(pct, 2)}%">🚗</span></div>
  <div class="card panel"><div class="qtext">${esc(q[2])}</div>
    <div class="choices" id="chs">${q[3].map((c, k) => `<button class="ch" data-k="${k}"><span class="k">${LET[k]}</span><span>${esc(c)}</span></button>`).join('')}</div>
    <div id="fb" aria-live="polite"></div></div>`;
  const readQ = () => Voice.say(SP.question(q));
  $('#say').onclick = readQ;
  if (Voice.auto && Voice.on) readQ();
  $$('.ch').forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const q = QZ.list[QZ.i], ok = k === q[4], fb = $('#fb'), last = QZ.i === QZ.list.length - 1;
  QZ.ans[QZ.i] = k;
  if (ok) Prog.clearWrong(q[0]); else Prog.addWrong(q[0]);
  const next = () => { if (last) { finish(); } else { QZ.i++; Quiz(); } };
  if (QZ.mode === 'exam') { $$('.ch').forEach(b => b.disabled = true); Voice.stop(); setTimeout(next, 250); return; }
  Voice.stop();
  $$('.ch').forEach(b => { b.disabled = true; const i = +b.dataset.k; if (i === q[4]) b.classList.add('right'); else if (i === k) b.classList.add('wrong'); });
  const th = topicOf(q[1]);
  fb.innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? '✅ ถูกต้อง!' : '❌ ยังไม่ถูก — คำตอบคือข้อ ' + LET[q[4]]}</b>
    <div style="margin-top:4px">${esc(q[5])}</div>
    <div style="margin-top:6px"><span class="chip">💡 ตัวช่วยจำ</span> ${esc(th.rhyme)}</div>
    ${q[6] ? `<div class="warn">⚠️ ${esc(q[6])}</div>` : ''}
    <div class="row" style="margin-top:10px"><button class="btn go" id="nx">${last ? 'ดูผลคะแนน' : 'ข้อต่อไป →'}</button>
    <button class="btn small" id="rs">🔊 ฟังเฉลย</button></div></div>`;
  $('#nx').onclick = next; $('#nx').focus();
  const sayFb = () => Voice.say([ok ? SP.verdictOk : SP.verdictNo(q), q[5], SP.hint, th.rhyme]);
  $('#rs').onclick = sayFb;
  if (ok) confetti();
  if (Voice.auto && Voice.on) sayFb();
}

function finish() {
  const score = QZ.list.filter((q, i) => QZ.ans[i] === q[4]).length, pct = Math.round(score / QZ.list.length * 100);
  Store.set('rounds', Prog.done() + 1);
  if (pct > Prog.best()) Store.set('best', pct);
  QZ.score = score; QZ.pct = pct;
  go('result');
}

/* ---------- ผลคะแนน ---------- */
function Result() {
  const N = QZ.list.length, pct = QZ.pct, C = 2 * Math.PI * 80;
  const msg = pct >= 90 ? ['🏆 พร้อมสอบจริง!', 'แม่นมาก รักษาฟอร์มไว้'] : pct >= 70 ? ['👍 ใกล้แล้ว', 'ทวนตัวช่วยจำข้อที่พลาดอีกนิด'] : ['📚 ต้องซ้อมเพิ่ม', 'กลับไปดูตัวช่วยจำแล้วลองใหม่'];
  const wrong = QZ.list.filter((q, i) => QZ.ans[i] !== q[4]);
  const per = TOPICS.map(t => { const xs = QZ.list.map((q, i) => [q, i]).filter(x => x[0][1] === t.id); return xs.length ? { t, n: xs.length, ok: xs.filter(x => QZ.ans[x[1]] === x[0][4]).length } : null; }).filter(Boolean);
  view().innerHTML = `<div class="card panel" style="text-align:center">
    <div class="ring"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--line)" stroke-width="16"/>
      <circle id="rg" cx="95" cy="95" r="80" fill="none" stroke="${pct >= 90 ? 'var(--ok)' : pct >= 70 ? 'var(--accent)' : 'var(--bad)'}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/></svg>
      <div class="num"><span id="pn">0</span>%</div></div>
    <h2 class="tt" style="margin-top:10px">${msg[0]}</h2>
    <p class="muted" style="margin:4px 0">ได้ ${QZ.score} จาก ${N} ข้อ · ${msg[1]} (เป้าหมายซ้อม ≥ 90%)</p>
    <div class="row" style="justify-content:center;margin-top:12px">
      ${wrong.length ? '<button class="btn primary" id="rw">🔁 ทำซ้ำเฉพาะข้อที่ผิด</button>' : ''}
      <button class="btn" data-go="setup">ทำชุดใหม่</button><button class="btn" data-go="study">🧠 ทวนตัวช่วยจำ</button></div></div>
  <div class="card panel"><b class="tt">คะแนนแยกหมวด</b><div class="bars">${per.map(p => `<div class="bar"><span>${p.t.icon} ${esc(p.t.title)}</span><span class="b"><i data-w="${p.ok / p.n * 100}"></i></span><span>${p.ok}/${p.n}</span></div>`).join('')}</div></div>
  ${wrong.length ? `<h3 class="tt" style="margin:20px 0 6px">ข้อที่ต้องทวน (${wrong.length})</h3>${wrong.map(q => keyItem(q, QZ.ans[QZ.list.indexOf(q)])).join('')}` : ''}`;
  requestAnimationFrame(() => setTimeout(() => {
    $('#rg').style.strokeDashoffset = C * (1 - pct / 100); countUp($('#pn'), pct, 1300);
    $$('.bar i').forEach(i => i.style.width = i.dataset.w + '%');
  }, 60));
  if (pct >= 90) { confetti(); }
  Voice.say(SP.result[pct >= 90 ? 0 : pct >= 70 ? 1 : 2]);
  const rw = $('#rw');
  if (rw) rw.onclick = () => { QZ = { list: wrong, i: 0, mode: 'practice', ans: [], topic: 'wrong' }; go('quiz'); };
}

/* ---------- สมุดเฉลย ---------- */
function keyItem(q, picked) {
  return `<div class="kitem"><div class="row"><b class="tt">ข้อ ${q[0]}.</b> <span class="chip">${topicOf(q[1]).icon} ${esc(topicOf(q[1]).title)}</span>
    <button class="btn small no-print" data-say="${q[0]}" style="margin-left:auto">🔊 ฟัง</button></div>
    <div style="margin:4px 0">${esc(q[2])}</div>
    <ol>${q[3].map((c, k) => `<li class="${k === q[4] ? 'right' : ''}">${k === q[4] ? '✅' : (k === picked ? '❌' : '&nbsp;&nbsp;&nbsp;')} ${LET[k]}. ${esc(c)}${k === picked && k !== q[4] ? ' <span class="muted">(คำตอบของคุณ)</span>' : ''}</li>`).join('')}</ol>
    <div><span class="ans">เฉลย ข้อ ${LET[q[4]]}</span> — ${esc(q[5])}</div>${q[6] ? `<div class="warn">⚠️ ${esc(q[6])}</div>` : ''}</div>`;
}
function Key() {
  view().innerHTML = `<h2 class="tt" style="margin:20px 0 8px">สมุดเฉลย ${QS.length} ข้อ</h2>
  <div class="row no-print"><select id="kf" aria-label="กรองตามหมวด"><option value="all">ทุกหมวด</option>${TOPICS.map(t => `<option value="${t.id}">${t.icon} ${esc(t.title)}</option>`).join('')}</select>
    <input id="kq" type="search" placeholder="ค้นหาคำในโจทย์…" style="font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);flex:1;min-width:160px">
    <button class="btn small" id="pr">🖨️ พิมพ์</button></div><div id="kl"></div>`;
  const draw = () => {
    const f = $('#kf').value, s = $('#kq').value.trim();
    const xs = QS.filter(q => (f === 'all' || q[1] === f) && (!s || (q[2] + q[3].join(' ')).includes(s)));
    $('#kl').innerHTML = xs.length ? xs.map(q => keyItem(q)).join('') : '<p class="muted">ไม่พบข้อที่ตรงกับเงื่อนไข</p>';
    $$('[data-say]').forEach(b => b.onclick = () => { const q = QS.find(x => x[0] === +b.dataset.say); Voice.say([SP.question(q), SP.ansOnly(q), q[5]]); });
  };
  $('#kf').onchange = draw; $('#kq').oninput = draw; $('#pr').onclick = () => print(); draw();
}

/* ---------- แผงตั้งค่าเสียง ---------- */
function renderVoiceInfo() {
  const p = $('#vinfo'); if (!p) return;
  const sel = $('#vsel');
  sel.innerHTML = Voice.list.length ? Voice.list.map(v => `<option ${v.name === (Voice.pick() || {}).name ? 'selected' : ''}>${esc(v.name)}</option>`).join('') : '<option>ไม่พบเสียงไทย</option>';
  p.textContent = Voice.hasClips() ? 'ใช้เสียงพากย์แบบธรรมชาติ (Premwadee) ที่บันทึกไว้ล่วงหน้า — เลือกเสียงด้านบนใช้เฉพาะข้อความที่ไม่มีไฟล์เสียง' :
    !Voice.ok ? 'เบราว์เซอร์นี้ไม่รองรับเสียงพากย์' : Voice.list.length ? `พบเสียงภาษาไทย ${Voice.list.length} เสียง พร้อมใช้งาน` :
    'ยังไม่พบเสียงภาษาไทยในเครื่องนี้ — ลองใช้ Microsoft Edge (มีเสียงไทยออนไลน์) หรือติดตั้งภาษาไทยใน Windows: การตั้งค่า > เวลาและภาษา > เสียงพูด. ระหว่างนี้อนิเมชันและตัวหนังสือยังทำงานตามปกติ';
}
function initVoicePanel() {
  const vp = $('#vpanel');
  vp.innerHTML = `<div class="in" style="max-width:900px;margin:0 auto;padding:12px 16px;display:grid;gap:10px">
    <div class="row"><label class="row"><input type="checkbox" id="von"> เปิดเสียงพากย์</label>
    <label class="row"><input type="checkbox" id="vauto"> อ่านโจทย์/เฉลยอัตโนมัติ</label></div>
    <div class="row"><label for="vrate">ความเร็ว</label><input id="vrate" type="range" min="0.6" max="1.3" step="0.05"><output id="vro"></output>
    <select id="vsel" aria-label="เลือกเสียง"></select><button class="btn small" id="vtest">▶ ทดสอบเสียง</button></div>
    <div id="vinfo" class="muted" style="font-size:.92rem"></div></div>`;
  $('#von').checked = Voice.on; $('#vauto').checked = Voice.auto; $('#vrate').value = Voice.rate; $('#vro').textContent = Voice.rate + '×';
  $('#von').onchange = e => { Voice.on = e.target.checked; Voice.save(); syncVoiceBtn(); if (!Voice.on) Voice.stop(); };
  $('#vauto').onchange = e => { Voice.auto = e.target.checked; Voice.save(); };
  $('#vrate').oninput = e => { Voice.rate = +e.target.value; $('#vro').textContent = Voice.rate + '×'; Voice.save(); };
  $('#vsel').onchange = e => { Voice.voiceName = e.target.value; Voice.save(); };
  $('#vtest').onclick = () => Voice.say(SP.test, { silent: true });
  renderVoiceInfo();
}
function syncVoiceBtn() { const b = $('#vbtn'); b.setAttribute('aria-pressed', Voice.on); b.textContent = Voice.on ? '🔊 เสียง' : '🔇 เสียง'; }

/* ---------- เริ่มต้น ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go, b.dataset.arg);
});
$('#vbtn').onclick = () => { const p = $('#vpanel'); p.hidden = !p.hidden; };
initVoicePanel(); syncVoiceBtn();
go('home');

</script>
